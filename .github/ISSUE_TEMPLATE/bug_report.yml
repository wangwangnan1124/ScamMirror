name: Bug report
description: Report a reproducible, non-sensitive product problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include real conversations, phone numbers, account details, verification codes, credentials, or active phishing links. Use synthetic examples only.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and synthetic input.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, credentials, and active malicious links.
          required: true
