name: Feature request
description: Propose a focused product or safety improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: user_problem
    attributes:
      label: User problem
      description: What user decision or safety problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Safety and privacy considerations
      description: What could go wrong, and how should the product fail safely?
    validations:
      required: true
